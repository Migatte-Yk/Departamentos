<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Departamentos y Municipios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: white;
            color: black;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            background-color: #4CAF50;
            padding: 0.5rem;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            display: block;
        }
        nav ul li a:hover {
            background-color: black;
            border-radius: 4px;
        }
        main {
            padding: 2rem;
            text-align: center;
        }
        .button {
            display: inline-block;
            margin: 1rem;
            padding: 0.75rem 1.5rem;
            color: white;
            background-color: black;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
        }
        .button:hover {
            background-color: black;
        }
    </style>
</head>
<body>

<header>
    <h1>Administración de Departamentos y Municipios</h1>
</header>

<nav>
    <ul>
        <li><a href="/departamentos/list">Departamentos de Colombia</a></li>
        <li><a href="/municipios/list">Municipios de Colombia</a></li>
        <li><a href="/departamentos/crear">Crear Departamento</a></li>
        <li><a href="/municipios/crear">Crear Municipio</a></li>
    </ul>
</nav>

<main>
    <p>Seleccione una opción del menú para comenzar.</p>
</main>

</body>
</html>
