<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos de Colombia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        nav {
            text-align: center;
            margin: 10px 0;
        }
        nav a {
            margin: 5px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Departamentos de Colombia</h1>

    <nav>
        <a href="/">Volver al Inicio</a>
        <a href="/departamentos/crear">Crear Nuevo Departamento</a>
    </nav>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Gobernador</th>
                <th>Municipios</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="departamento : ${departamentos}">
                <td th:text="${departamento.id}"></td>
                <td th:text="${departamento.nombre}"></td>
                <td th:text="${departamento.gobernador}"></td>
                <td>
                    <a th:href="@{/departamentos/{id}/municipios(id=${departamento.id})}">Ver Municipios</a>
                </td>
                <td>
                    <a th:href="@{/departamentos/modificar/{id}(id=${departamento.id})}">Modificar</a>
                    <a th:href="@{/departamentos/eliminar/{id}(id=${departamento.id})}" 
                       onclick="return confirm('¿Estás seguro de que deseas eliminar este departamento?')">
                       Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
