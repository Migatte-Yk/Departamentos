<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Departamento</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }

        nav {
            text-align: center;
            margin: 10px 0;
        }

        nav a {
            margin: 5px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #45a049;
        }

        .form-container {
        max-width: 600px;
        margin: 30px auto;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
        margin-bottom: 20px;
        }

        .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        }

        .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        box-sizing: border-box;
        }

        .form-actions {
        text-align: center;
        }

        button {
        background-color: #45a049;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
        }


    </style>

</head>
<body>
    <h1>Crear Departamento</h1>

    <nav>
        <a href="/">Volver al Inicio</a>
        <a href="/departamentos/list">Lista de departamentos</a>
    </nav>

    <div class="form-container">
        <form th:action="@{/departamentos/crear}" th:object="${departamento}" method="post">
            <div class="form-group">
                <label for="nombre">Nombre del Departamento:</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre del departamento" required>
            </div>

            <div class="form-group">
                <label for="gobernador">Nombre del Gobernador:</label>
                <input type="text" id="gobernador" th:field="*{gobernador}" placeholder="Ingrese el nombre del gobernador" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="button">Guardar Departamento</button>
            </div>
        </form>
    </div>

</body>
</html>
