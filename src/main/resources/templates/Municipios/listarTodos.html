<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipios de Colombia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
        table {
            width: 90%; /* Mantiene la tabla con un ancho más controlado */
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        nav {
            text-align: center;
            margin: 10px 0;
        }
        nav a {
            margin: 5px;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #45a049;
        }
        .button {
            display: inline-block;
            margin: 10px auto;
            padding: 10px 15px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Municipios de Colombia</h1>

    <nav>
        <a href="/">Volver al Inicio</a>
        <a href="/municipios/crear">Crear Nuevo Municipio</a>
    </nav>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Departamento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="municipio : ${municipios}">
                <td th:text="${municipio.id}"></td>
                <td th:text="${municipio.nombre}"></td>
                <td th:text="${municipio.departamento.nombre}"></td>
                <td>
                    <a th:href="@{/municipios/modificar/{id}(id=${municipio.id})}">Modificar</a>
                    <a th:href="@{/municipios/eliminar/{id}(id=${municipio.id})}"
                    onclick="return confirm('¿Estás seguro de que deseas eliminar este municipio?')">
                        Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
